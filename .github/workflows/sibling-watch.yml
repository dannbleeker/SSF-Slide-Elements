name: sibling watch

# Most of what this repo knows about the PowerPoint host was learned by
# SSF-Charts and carried through SSF-Merge, and without this it would arrive
# here by somebody happening to read those repos. SSF-Merge measured what that
# luck cost it: 44 hand-copied citations, five carrying a counter that went
# stale the next time a round ran.
#
# Weekly, after both siblings' own Monday sweeps (SSF-Charts at 06:17 and
# 06:41 UTC, SSF-Merge's watcher at 07:41), so a finding they triage that
# morning is in their tables before this looks.
on:
  schedule:
    - cron: "41 8 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  sweep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      # No `npm ci`. The sweep imports nothing but its own module, and a weekly
      # job that installs a dependency tree fails for reasons that have nothing
      # to do with the siblings — which is a job nobody reads.
      - name: Sweep the siblings' tables
        id: sweep
        run: |
          set +e
          node scripts/sibling-watch.mjs > /tmp/report.md
          code=$?
          set -e
          # 3 means "something is untriaged"; 0 means everything has a row.
          # Anything else is a BROKEN SWEEP — a table renamed upstream, or a
          # repo unreachable — and must never be reported as a quiet week.
          if [ "$code" != "0" ] && [ "$code" != "3" ]; then
            echo "the sweep itself failed (exit $code)" >&2
            cat /tmp/report.md >&2 || true
            exit "$code"
          fi
          echo "found=$([ "$code" = "3" ] && echo yes || echo no)" >> "$GITHUB_OUTPUT"
          cat /tmp/report.md
      # One issue, reopened and updated. A weekly job that files a new issue
      # every Monday is a spam bot with a cron entry.
      - name: File or update the report
        if: steps.sweep.outputs.found == 'yes'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          title="sibling watch: SSF-Charts and SSF-Merge findings with no row in the ledger"
          existing=$(gh issue list --state all --search "$title in:title" --json number,state --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body-file /tmp/report.md
            gh issue reopen "$existing" || true
          else
            gh issue create --title "$title" --body-file /tmp/report.md
          fi
